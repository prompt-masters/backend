services:
  postgres:
    image: postgres:16-alpine
    container_name: prompters-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: prompters_db
    ports:
      # Override POSTGRES_PORT if 5432 is already taken on your machine.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prompters_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Apply migrations first: make migrate-up (goose) against the running
  # database before starting the app, or run `make migrate-up` after up.
  app:
    build: .
    container_name: prompters-api
    depends_on:
      postgres:
        condition: service_healthy
    # Picks up MAIL_* from .env when present. Leave MAIL_HOST empty and
    # verification links are written to `docker compose logs app` instead of
    # being emailed.
    env_file:
      - path: .env
        required: false
    # These override anything in .env: inside the compose network the
    # database is reachable as "postgres", and the container always listens
    # on 8080 regardless of which host port is published.
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATABASE_URL: postgres://postgres:password@postgres:5432/prompters_db?sslmode=disable
      APP_BASE_URL: http://localhost:${APP_PORT:-8080}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
